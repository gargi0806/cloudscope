name: CloudScope Pulse CI (isolated subproject)
on:
  pull_request:
    paths:
      - 'cloudscope-pulse/**'
      - '.github/workflows/cloudscope-pulse-ci.yml'
  push:
    branches: [main]
    paths:
      - 'cloudscope-pulse/**'
      - '.github/workflows/cloudscope-pulse-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudscope-pulse
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: cloudscope-pulse/app/requirements-dev.txt
      - name: Install test and audit tools
        run: python -m pip install -r app/requirements-dev.txt pip-audit
      - name: Run unit tests
        run: python -m pytest -q tests
      - name: Validate Kubernetes manifests
        run: python scripts/validate_manifests.py
      - name: Audit Python dependencies
        run: python -m pip_audit -r app/requirements.txt
      - uses: hashicorp/setup-terraform@v3
      - name: Check Terraform formatting
        run: terraform -chdir=terraform fmt -check -recursive
      - name: Initialize Terraform without state
        run: terraform -chdir=terraform init -backend=false -input=false
      - name: Validate Terraform
        run: terraform -chdir=terraform validate
      - name: Build Docker image
        run: docker build -t cloudscope-pulse:ci .
      - name: Scan image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: cloudscope-pulse:ci
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          vuln-type: os,library
