name: CI - tests, validation, image scanning
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: app/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r app/requirements-dev.txt pip-audit
      - name: Unit tests
        run: python -m pytest -q tests
      - name: Validate manifests
        run: python scripts/validate_manifests.py
      - name: Audit direct and transitive Python dependencies
        run: python -m pip_audit -r app/requirements.txt
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Terraform formatting
        run: terraform -chdir=terraform fmt -recursive
      - name: Terraform init (no state backend)
        run: terraform -chdir=terraform init -backend=false -input=false
      - name: Terraform validate
        run: terraform -chdir=terraform validate
      - name: Build Docker image
        run: docker build -t cloudscope-pulse:ci .
      - name: Scan Docker image for high/critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: cloudscope-pulse:ci
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          vuln-type: os,library
