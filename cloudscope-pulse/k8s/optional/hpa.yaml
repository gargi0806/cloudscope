# Optional: metrics-server must be installed before this HPA can operate.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cloudscope-api
  namespace: cloudscope
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cloudscope-api
  minReplicas: 2
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
